packages:
  - 'apps/*'
  - 'packages/*'

# Build scripts we deliberately allow. Prisma and swc ship native binaries and
# do not work without their postinstall step; unrs-resolver backs eslint's
# module resolution and esbuild backs tsx.
allowBuilds:
  '@prisma/engines': true
  argon2: true
  '@swc/core': true
  esbuild: true
  prisma: true
  unrs-resolver: true
  # BullMQ's msgpack accelerator. Left off: it is a native build for a speed-up
  # nobody here can measure, and the pure-JS path is one less thing to compile.
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - lucide-react@1.44.0
  - zod@4.6.2
  - '@aws-sdk/client-s3@3.1130.0'
  - '@aws-sdk/s3-request-presigner@3.1130.0'
