name: Deploy

# Only after CI has passed on main. A deploy that races its own test run is
# how a red build reaches production.
on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  # Never two deploys at once on the box. Not cancel-in-progress: killing a
  # deploy halfway leaves the stack in an unknown state — the next one waits.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # A push to main whose CI failed must not deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: [self-hosted, primary-server]
    # Grants the job the production environment's secrets.
    environment: production
    timeout-minutes: 30

    env:
      DEPLOY_DIR: /home/mtpl/docker/PDFly
      COMPOSE: docker compose -f docker-compose.prod.yml

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          # workflow_run reports the SHA it was triggered by, not the branch
          # tip, so the deploy matches the code CI actually tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Record the start time
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Notify Slack — started
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/slack-notify.mjs started || true

      - name: Sync the working tree to the deploy directory
        run: |
          set -euo pipefail
          mkdir -p "$DEPLOY_DIR"
          # --delete removes files that left the repo so nothing stale lingers.
          # The server keeps its own .env and RELEASE_SHA; never overwrite them.
          rsync -a --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.next' \
            --exclude 'dist' --exclude '.env' --exclude 'RELEASE_SHA' \
            ./ "$DEPLOY_DIR/"

      - name: Capture the current release, for rollback
        id: previous
        run: |
          cd "$DEPLOY_DIR"
          if [[ -f RELEASE_SHA ]]; then
            echo "sha=$(cat RELEASE_SHA)" >> "$GITHUB_OUTPUT"
          else
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Write .env from the production environment secrets
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          WEBHOOK_SIGNING_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          # Non-secret config, overridable by environment variables.
          DOMAIN: ${{ vars.PDFLY_DOMAIN || 'pdfly.morphsync.in' }}
          SCHEME: ${{ vars.PDFLY_SCHEME || 'http' }}
          COOKIE_SECURE: ${{ vars.PDFLY_COOKIE_SECURE || 'false' }}
          SEED_ADMIN_EMAIL: ${{ vars.SEED_ADMIN_EMAIL || 'admin@morphsync.in' }}
          SEED_ADMIN_NAME: ${{ vars.SEED_ADMIN_NAME || 'Administrator' }}
          SEED_ADMIN_ORG: ${{ vars.SEED_ADMIN_ORG || 'Morphsync' }}
        run: |
          set -euo pipefail

          # Percent-encode the DB credentials so a password with URL-special
          # characters cannot corrupt the connection string.
          enc() { python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$1"; }
          PGUSER_ENC="$(enc "$POSTGRES_USER")"
          PGPASS_ENC="$(enc "$POSTGRES_PASSWORD")"

          umask 077
          cat > "$DEPLOY_DIR/.env" <<EOF
          NODE_ENV=production
          LOG_LEVEL=info

          API_PORT=8101
          WEB_PORT=8100
          MINIO_PORT=9100
          API_URL=${SCHEME}://${DOMAIN}
          WEB_URL=${SCHEME}://${DOMAIN}
          NEXT_PUBLIC_API_URL=${SCHEME}://${DOMAIN}
          COOKIE_SECURE=${COOKIE_SECURE}

          DATABASE_URL=postgresql://${PGUSER_ENC}:${PGPASS_ENC}@host.docker.internal:5432/${POSTGRES_DB}?schema=public

          S3_ENDPOINT=http://minio:9000
          S3_PUBLIC_ENDPOINT=${SCHEME}://${DOMAIN}
          S3_REGION=auto
          S3_BUCKET=pdfly-files
          S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
          S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
          S3_FORCE_PATH_STYLE=true

          QUEUE_CONCURRENCY=2
          WEBHOOK_SIGNING_SECRET=${WEBHOOK_SIGNING_SECRET}
          WEBHOOK_ALLOW_PRIVATE=false

          JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
          ENCRYPTION_KEY=${ENCRYPTION_KEY}

          SMTP_HOST=${SMTP_HOST}
          SMTP_PORT=${SMTP_PORT}
          SMTP_USERNAME=${SMTP_USERNAME}
          SMTP_PASSWORD=${SMTP_PASSWORD}
          SMTP_FROM=${SMTP_FROM}

          SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}
          SEED_ADMIN_NAME=${SEED_ADMIN_NAME}
          SEED_ADMIN_ORG=${SEED_ADMIN_ORG}
          SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
          EOF
          echo "wrote $DEPLOY_DIR/.env ($(wc -l < "$DEPLOY_DIR/.env") lines)"

      - name: Build images
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          # --profile tools so the migrate image is built alongside the rest.
          $COMPOSE --profile tools build

      - name: Apply database migrations
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          # Bring internal storage up first (the api will need it), then migrate
          # the host database. migrate deploy only applies; it never resets.
          $COMPOSE up -d --wait redis minio
          $COMPOSE --profile tools run --rm api-migrate

      - name: Start the stack
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          $COMPOSE up -d --remove-orphans

      - name: Ensure the first administrator exists
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          # Idempotent: an existing admin is left untouched, password included.
          $COMPOSE run --rm --no-deps api node dist/cli/seed-admin.js

      - name: Health check
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8101/health > /tmp/pdfly-health.json 2>/dev/null; then
              echo "healthy after ${attempt} attempt(s)"; cat /tmp/pdfly-health.json; exit 0
            fi
            sleep 2
          done
          echo "::error::the api did not become healthy within 60s"
          cd "$DEPLOY_DIR"
          curl -sS --max-time 5 http://127.0.0.1:8101/health || true
          $COMPOSE ps
          $COMPOSE logs --tail 100 api renderer
          exit 1

      - name: Record this release
        run: echo "${{ github.event.workflow_run.head_sha || github.sha }}" > "$DEPLOY_DIR/RELEASE_SHA"

      - name: Remove images nothing is using
        run: docker image prune -f --filter 'dangling=true' || true

      # -----------------------------------------------------------------
      - name: Roll back
        if: failure() && steps.previous.outputs.sha != ''
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          echo "::warning::deploy failed; rolling back to ${{ steps.previous.outputs.sha }}"
          # The database is deliberately not rolled back — reversing a migration
          # that already has data written against it is how that data is lost.
          git -C "$GITHUB_WORKSPACE" checkout --force "${{ steps.previous.outputs.sha }}"
          rsync -a --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.next' \
            --exclude 'dist' --exclude '.env' --exclude 'RELEASE_SHA' \
            "$GITHUB_WORKSPACE/" "$DEPLOY_DIR/"
          $COMPOSE --profile tools build
          $COMPOSE up -d --remove-orphans

      - name: Notify Slack — rolled back
        if: failure() && steps.previous.outputs.sha != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/slack-notify.mjs rolled-back "Deploy failed; previous release ${{ steps.previous.outputs.sha }} restored. Database not rolled back." || true

      - name: Notify Slack — failed
        if: failure() && steps.previous.outputs.sha == ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/slack-notify.mjs failed "No previous release to roll back to; the stack may be partly up." || true

      - name: Notify Slack — succeeded
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEPLOY_HEALTH_URL: ${{ vars.PDFLY_DOMAIN && format('http://{0}/health', vars.PDFLY_DOMAIN) || 'http://pdfly.morphsync.in/health' }}
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.start.outputs.at }} ))
          export DEPLOY_DURATION="$(( elapsed / 60 ))m $(( elapsed % 60 ))s"
          node scripts/slack-notify.mjs succeeded || true
