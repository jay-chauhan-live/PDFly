name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Values only need to satisfy the env schema; CI touches a real Postgres and
  # Redis via the service containers below.
  DATABASE_URL: postgresql://pdfly:pdfly@localhost:5432/pdfly?schema=public
  REDIS_URL: redis://localhost:6379
  S3_ENDPOINT: http://localhost:9000
  S3_BUCKET: pdfly
  S3_ACCESS_KEY_ID: pdfly
  S3_SECRET_ACCESS_KEY: pdfly-dev-secret
  JWT_ACCESS_SECRET: ci-access-secret-not-a-real-key
  ENCRYPTION_KEY: Y2ktb25seS1ub3QtYS1yZWFsLWtleS0wMDAwMDAwMDA=

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pdfly
          POSTGRES_PASSWORD: pdfly
          POSTGRES_DB: pdfly
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pdfly -d pdfly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      # qpdf applies PDF encryption (PLAN §3). It is an external binary, not an
      # npm dependency, so CI has to install it the same way a deployment does.
      - name: Install qpdf
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Playwright's postinstall downloads Chromium (~100 MB); cache it so
      # every run does not pay for the download.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @pdfly/api exec prisma migrate deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
