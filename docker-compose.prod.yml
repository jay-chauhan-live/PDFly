# Production stack for primary-server. Standalone — it does NOT merge the dev
# docker-compose.yml, whose host-published ports would collide on this shared
# box. Run it on its own:
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Topology on this host:
#   - Postgres is the host's shared instance, reached over host-gateway. No
#     database container here.
#   - Redis, MinIO and the renderer are internal containers, unreachable from
#     outside the compose network.
#   - api and web bind to 127.0.0.1 only; the host nginx terminates TLS for
#     pdfly.thetechpacks.com and proxies to them (and to MinIO for downloads).
#   - The renderer sits on an internal network with no gateway. Its only route
#     out is the egress proxy, which resolves DNS itself and refuses private
#     destinations at connect time (PLAN §11).
#
# Values come from the .env in this directory (compose loads it automatically).

name: pdfly

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    # The host's Postgres listens on the docker bridge; this name resolves to it.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file: [.env]
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      RENDERER_URL: http://renderer:3002
      # Signing and uploads both go through the public endpoint so the signed
      # URLs a browser receives actually resolve (path-style, bucket in path).
      S3_FORCE_PATH_STYLE: 'true'
      WEBHOOK_ALLOW_PRIVATE: 'false'
    # Loopback only: nginx on the host is the sole way in.
    ports:
      - '127.0.0.1:${API_PORT:-8101}:3001'
    networks: [backend, render]
    # Nothing writes to the image at runtime; qpdf's scratch dir is a tmpfs.
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 1g }

  renderer:
    build:
      context: .
      dockerfile: apps/renderer/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      POOL_SIZE: ${POOL_SIZE:-2}
      EGRESS_PROXY: http://egress-proxy:3128
    networks: [render]
    depends_on: [egress-proxy]
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
      # Chromium's default /dev/shm is 64 MB in a container; it exhausts it and
      # crashes in a way that looks like a random hang.
      - /dev/shm:size=1g
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Chromium's sandbox builds its own namespaces, which needs unshare/clone
    # syscalls the default seccomp profile denies. PLAN §11: grant what the
    # sandbox needs rather than pass --no-sandbox, since this is the process
    # running attacker-controlled markup.
    cap_add: [SYS_ADMIN]
    deploy:
      resources:
        limits: { memory: 2g, cpus: '2' }

  # Runs migrations and exits. A separate image target because the Prisma CLI
  # is a devDependency the runtime image prunes, and a schema-altering tool has
  # no business inside the process serving traffic. `profiles` keeps it out of
  # `up`; the deploy invokes it with `run --rm`.
  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    profiles: [tools]
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file: [.env]
    restart: 'no'

  egress-proxy:
    image: ubuntu/squid:latest
    restart: unless-stopped
    volumes:
      - ./docker/squid-egress.conf:/etc/squid/squid.conf:ro
    networks: [render, egress]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { memory: 256m }

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # BullMQ needs noeviction: a maxmemory-evicting Redis silently drops job
    # data. Append-only so a restart does not lose the queue.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    # No published port: the host already runs a Redis on 6379, and this one is
    # for PDFly alone, reachable only inside the compose network.
    networks: [backend]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: [no-new-privileges:true]

  # quay.io, not Docker Hub: MinIO gated its Docker Hub images behind login.
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    # Published on loopback so the host nginx can proxy /pdfly-files/ to it;
    # not otherwise reachable.
    ports:
      - '127.0.0.1:${MINIO_PORT:-9100}:9000'
    networks: [backend]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]

  # One-shot: creates the bucket so the api never bootstraps storage itself.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${S3_ACCESS_KEY_ID}\" \"$${S3_SECRET_ACCESS_KEY}\" &&
      mc mb --ignore-existing \"local/$${S3_BUCKET}\" &&
      echo 'bucket ready: '\"$${S3_BUCKET}\"
      "
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-pdfly-files}
    networks: [backend]
    restart: 'no'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined into the bundle at build time; same origin as the site.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - '127.0.0.1:${WEB_PORT:-8100}:3000'
    networks: [frontend]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 512m }

networks:
  frontend:
  backend:
  # internal: no gateway. The renderer lives here with two peers only — the
  # api, which calls in, and the egress proxy, the one filtered way out.
  render:
    internal: true
  egress:

volumes:
  redis-data:
  minio-data:
