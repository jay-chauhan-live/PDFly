# Egress proxy for the renderer (PLAN §11).
#
# Chromium's only route off its isolated network. Two things make this worth
# having over the in-process address check:
#
#   1. Squid resolves DNS itself and applies the ACL to the resolved address,
#      so a hostname that answers publicly and then privately — DNS rebinding
#      — is refused at connect time rather than at check time. That is the gap
#      an application-level check cannot close.
#   2. It applies to every connection the browser makes, including ones that
#      never pass through Playwright's request router.

http_port 3128

# Addresses no user-supplied document has any business reaching.
acl private_ranges dst 0.0.0.0/8
acl private_ranges dst 10.0.0.0/8
acl private_ranges dst 100.64.0.0/10
acl private_ranges dst 127.0.0.0/8
acl private_ranges dst 169.254.0.0/16
acl private_ranges dst 172.16.0.0/12
acl private_ranges dst 192.168.0.0/16
acl private_ranges dst 198.18.0.0/15
acl private_ranges dst 224.0.0.0/4
acl private_ranges dst 240.0.0.0/4
acl private_ranges dst ::1
acl private_ranges dst fc00::/7
acl private_ranges dst fe80::/10

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Order matters: the denials come first, and the last rule is the default.
http_access deny private_ranges
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow all

# Nothing is cached. A shared cache between tenants is a way for one
# document's assets to leak into another's.
cache deny all
cache_dir null /tmp

# Squid's own identity, not the browser's, and no via header describing the
# internal topology.
forwarded_for delete
via off
httpd_suppress_version_string on

dns_v4_first off
