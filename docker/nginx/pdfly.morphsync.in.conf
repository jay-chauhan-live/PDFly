# pdfly.morphsync.in — one domain, three upstreams. HTTP only.
#
# TLS is added separately (certificate installed by hand). When it is, add the
# 443 server block and redirect 80→443; until then this serves plain HTTP, and
# COOKIE_SECURE must be false in the api .env or the session cookie is dropped.
#
# Routing:
#   /v1/, /health   → api   (127.0.0.1:8101)   REST + readiness
#   /pdfly-files/   → minio (127.0.0.1:9100)   signed download links
#   /               → web   (127.0.0.1:8100)   the dashboard
server {
    listen 80;
    listen [::]:80;
    server_name pdfly.morphsync.in;

    access_log /var/log/nginx/pdfly.access.log;
    error_log  /var/log/nginx/pdfly.error.log;

    # Generous enough for the 5 MB HTML cap on renders and for PDF downloads.
    client_max_body_size 60m;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 512;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # The api: REST under /v1 and the readiness endpoint. A render can take a
    # while, so the read timeout is longer than nginx's default 60s.
    location /v1/ {
        proxy_pass http://127.0.0.1:8101;
        proxy_read_timeout   90s;
        proxy_connect_timeout 5s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8101;
        access_log off;
    }

    # Object storage. The api hands the browser signed URLs on this host under
    # /pdfly-files/<key>; MinIO validates the SigV4 signature against the Host
    # header and path it receives, so both must pass through unchanged.
    location /pdfly-files/ {
        proxy_pass http://127.0.0.1:9100;
        proxy_read_timeout 120s;
    }

    # The dashboard.
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_read_timeout 60s;
    }
}
