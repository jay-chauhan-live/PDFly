<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="PDFly">
  <defs>
    <linearGradient id="pdfly-mark-g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F6BFF"/>
      <stop offset="1" stop-color="#8B3DFF"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#pdfly-mark-g)"/>
  <!-- A page with a folded corner is the one shape that still reads as a
       document at 16px; the arrow says "produced, ready to take away". -->
  <path d="M11 6h6.4L23 11.6V24a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z" fill="#fff"/>
  <path d="M17.4 6 23 11.6h-3.6a2 2 0 0 1-2-2V6Z" fill="#C7D0FF"/>
  <path d="M16 13.8v6.4m0 0 2.6-2.6M16 20.2l-2.6-2.6" stroke="url(#pdfly-mark-g)"
        stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
